name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.2.3)'
        required: true

permissions:
  contents: write  # push the git tag
  id-token: write  # request OIDC token for NuGet Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    if: contains(inputs.version, '-beta.') || contains(inputs.version, '-alpha.') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ inputs.version }}

      - name: Unit Tests
        id: unit
        continue-on-error: true
        run: dotnet run --project tests/Gener8.Tests -c Release --no-build

      - name: Integration Tests - DynamoDb
        id: dynamo
        continue-on-error: true
        run: dotnet run --project tests/DynamoDb.Integration.Tests -c Release --no-build

      - name: Integration Tests - MongoDb
        id: mongo
        continue-on-error: true
        run: dotnet run --project tests/MongoDb.Integration.Tests -c Release --no-build

      - name: Integration Tests - CustomDb
        id: custom
        continue-on-error: true
        run: dotnet run --project tests/CustomDb.Integration.Tests -c Release --no-build

      - name: Check test results
        if: always()
        run: |
          failed=false
          for outcome in "${{ steps.unit.outcome }}" "${{ steps.dynamo.outcome }}" "${{ steps.mongo.outcome }}" "${{ steps.custom.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              failed=true
            fi
          done
          if [ "$failed" = "true" ]; then
            echo "One or more test suites failed"
            exit 1
          fi
          echo "All test suites passed"

      # Pack all three publishable packages
      - name: Pack Gener8.Abstractions
        run: dotnet pack src/Gener8.Abstractions/Gener8.Abstractions.csproj --no-build -c Release -p:Version=${{ inputs.version }} -o ./nupkg

      - name: Pack Gener8 (generator + bundled abstractions)
        run: dotnet pack src/Gener8/Gener8.csproj --no-build -c Release -p:Version=${{ inputs.version }} -o ./nupkg

      - name: Pack Gener8.Extensions.DynamoDB
        run: dotnet pack src/Gener8.Extensions.DynamoDB/Gener8.Extensions.DynamoDB.csproj --no-build -c Release -p:Version=${{ inputs.version }} -o ./nupkg

      - name: Pack Gener8.Extensions.MongoDB
        run: dotnet pack src/Gener8.Extensions.MongoDB/Gener8.Extensions.MongoDB.csproj --no-build -c Release -p:Version=${{ inputs.version }} -o ./nupkg

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag v${{ inputs.version }}
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git v${{ inputs.version }}
